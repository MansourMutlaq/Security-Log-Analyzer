detection:
  linux_brute_force:
    threshold: 4
    window_seconds: 300

  linux_user_enumeration:
    distinct_user_threshold: 2
    window_seconds: 300

  successful_login_after_failures:
    failure_threshold: 3
    window_seconds: 300

  cisco_interface_flap:
    window_seconds: 300

  suspicious_sudo:
    keywords:
      - "/etc/shadow"
      - "/etc/sudoers"
      - "useradd"
      - "chmod 777"
      - "visudo"

  aws:
    public_admin_ports:
      - 22
      - 3389

    privileged_policies:
      - "AdministratorAccess"
      - "IAMFullAccess"