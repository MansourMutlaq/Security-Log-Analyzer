[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-security-analytics"
version = "0.1.0"
description = "Multi-source infrastructure security analytics and threat detection platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "python-dateutil>=2.9",
    "opensearch-py>=2.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "bandit>=1.8"
]

[project.scripts]
security-analytics = "security_analytics.cli:app"

[tool.setuptools.packages.find]
include = ["security_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
